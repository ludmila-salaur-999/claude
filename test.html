<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complex Table Example</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
    button { margin-top: 16px; margin-right: 8px; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Sales Report</h1>

  <table id="reportTable">
    <thead>
      <tr>
        <th rowspan="2">Region</th>
        <th>R1</th>
        <th>R2</th>
        <th>R3</th>
        <th rowspan="2">Total</th>
      </tr>
      <tr>
        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
      </tr>
    </thead>
    <tbody id="reportBody"></tbody>
  </table>

  <button id="downloadPDF">Download as PDF</button>
  <button id="downloadScenarioPDF">Download Scenario as PDF</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script>
    // Each region = two split rows (top, bottom) plus a total spanning both.
    const DATA = [
      { name: 'North', top: [1200, 1500, 1700], bottom: [1234.567, 4567.89, 345.67],  total: 4400 },
      { name: 'South', top: [900, 1100, 1300],  bottom: [6789.567, 2345.89, 1212.67], total: 3300 },
      { name: 'East',  top: [1230, 1100, 1705], bottom: [1211.567, 4511.89, 345.11],  total: 4400 },
      { name: 'West',  top: [800, 950, 1200],   bottom: [5678.567, 2345.89, 1212.67], total: 2950 },
      { name: 'One',   top: [1400, 1660, 1770], bottom: [1288.567, 4999.89, 345.01],  total: 4400 },
      { name: 'Two',   top: [1000, 1200, 1500], bottom: [6789.567, 2345.89, 1212.67], total: 3700 },
      { name: 'Three', top: [1300, 1400, 1600], bottom: [1211.567, 4511.89, 345.11],  total: 4300 },
      { name: 'Four',  top: [900, 1100, 1300],  bottom: [5678.567, 2345.89, 1212.67], total: 3300 },
      { name: 'Five',  top: [1400, 1660, 1770], bottom: [1288.567, 4999.89, 345.01],  total: 4400 },
      { name: 'Six',   top: [1000, 1200, 1500], bottom: [6789.567, 2345.89, 1212.67], total: 3700 },
      { name: 'Seven', top: [1300, 1400, 1600], bottom: [1211.567, 4511.89, 345.11],  total: 4300 },
      { name: 'Eight', top: [900, 1100, 1300],  bottom: [5678.567, 2345.89, 1212.67], total: 3300 }
    ];

    // ---------- helpers ----------
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const randTop = () => randInt(700, 2000);                                   // integer-style value
    const randBottom = () => Math.round((Math.random() * 7000 + 200) * 100) / 100; // decimal-style value
    const clone = obj => JSON.parse(JSON.stringify(obj));

    // ---------- render HTML table from data ----------
    function renderTable() {
      const tbody = document.getElementById('reportBody');
      tbody.innerHTML = DATA.map(r => `
        <tr>
          <td rowspan="2">${r.name}</td>
          ${r.top.map(v => `<td>${v}</td>`).join('')}
          <td rowspan="2">${r.total}</td>
        </tr>
        <tr>
          ${r.bottom.map(v => `<td>${v}</td>`).join('')}
        </tr>`).join('');
    }
    renderTable();

    // ---------- PDF builder ----------
    function buildPdf(regions, headers, subHeaders, fileName) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('Sales Report', 14, 12);

      const body = [];
      regions.forEach(r => {
        body.push([
          { content: r.name, rowSpan: 2, styles: { valign: 'middle' } },
          ...r.top,
          { content: r.total, rowSpan: 2, styles: { valign: 'middle' } }
        ]);
        body.push([...r.bottom]);
      });

      doc.autoTable({
        head: [
          [{ content: 'Region', rowSpan: 2, styles: { valign: 'middle' } },
           ...headers,
           { content: 'Total', rowSpan: 2, styles: { valign: 'middle' } }],
          [...subHeaders]
        ],
        body,
        startY: 20,
        theme: 'grid',
        headStyles: {
          fillColor: [240, 240, 240],
          textColor: [0, 0, 0],
          fontStyle: 'bold',
          halign: 'center'
        },
        styles: { fontSize: 8, cellPadding: 3, halign: 'center' }
      });

      doc.save(fileName);
    }

    // ---------- original download ----------
    // Reads the table exactly as displayed (headers, rowspans, values) straight from the DOM
    document.getElementById('downloadPDF').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('Sales Report', 14, 12);

      doc.autoTable({
        html: '#reportTable',
        startY: 20,
        theme: 'grid',
        headStyles: {
          fillColor: [240, 240, 240],
          textColor: [0, 0, 0],
          fontStyle: 'bold',
          halign: 'center',
          valign: 'middle'
        },
        styles: { fontSize: 8, cellPadding: 3, halign: 'center', valign: 'middle' }
      });

      doc.save('test.pdf');
    });

    // ---------- scenario download ----------
    document.getElementById('downloadScenarioPDF').addEventListener('click', () => {
      const regions = clone(DATA);

      // 1) Remove one entire split row (a region's two rows) from the middle
      const lo = Math.floor(regions.length / 3);
      const hi = Math.ceil((regions.length * 2) / 3) - 1;
      regions.splice(randInt(lo, hi), 1);

      // 2) Insert one extra column in the middle of the data columns (between R2 and R3)
      const mid = 2;
      regions.forEach(r => {
        r.top.splice(mid, 0, randTop());
        r.bottom.splice(mid, 0, randBottom());
      });
      const headers = ['R1', 'R2', 'R4', 'R3'];
      const subHeaders = ['Q1', 'Q2', 'Q4', 'Q3'];

      // 3) Change three randomly selected number values (Total cells excluded)
      const cells = [];
      regions.forEach((r, ri) => {
        r.top.forEach((_, ci) => cells.push({ ri, row: 'top', ci }));
        r.bottom.forEach((_, ci) => cells.push({ ri, row: 'bottom', ci }));
      });
      for (let i = 0; i < 3; i++) {
        const c = cells.splice(randInt(0, cells.length - 1), 1)[0];
        const arr = regions[c.ri][c.row];
        const old = arr[c.ci];
        let nv;
        do { nv = c.row === 'top' ? randTop() : randBottom(); } while (nv === old);
        arr[c.ci] = nv;
      }

      buildPdf(regions, headers, subHeaders, 'scenario.pdf');
    });
  </script>

</body>
</html>
